---
title: 我们的产品
description: 为开发者、初创公司和有需求的客户提供软件开发和专业托管服务
---

<section class="diagonal patterned">
	<div class="container">
	    <p class="editor-link" style="text-align: center;"><a href="cloudcannon:collections/_products/" class="btn"><strong>&#9998;</strong> Manage Products</a></p>
		<ul class="image-grid">
			{% for product in site.products %}
				<li>
						<div class="details">
              <div class="card-header bg-white border-0 pb-0">
                <div class="d-flex">
                  <img src="{{ product.image }}" alt="Product Logo">
                </div>
                <h2> {{ product.name }} </h2>
              </div>
              <div class="card-body">
                <p class="mb-3">{{ product.description }}</p>               
                <p class="mb-3">{{ product.functions }}</p>
              </div>

              <div class="mb-3 prod-a">
                <a href="{{ site.baseurl }}{{ product.external_url}}">了解更多</a>
                </div>
						</div>
				</li>
			{% endfor %}
			<li class="filler"></li>
			<li class="filler"></li>
		</ul>
	</div>
</section>
